/* Layout: a drug package insert - Highlights box, boxed warning, numbered Full Prescribing Information sections, single 66ch column with wide figure and module breakouts */
:root{
  --paper:#fafbfc; --ink:#151a21; --muted:#5b6573; --rule:#d3d9e1; --tint:#eef2f7;
  --rx:#2346c8; --rx-soft:#e3e9fb; --warn:#a8231b; --pill:#e7c64a;
  --f-display:"Archivo Narrow","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --measure:66ch;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1318; --ink:#e5e9ef; --muted:#98a2b0; --rule:#2b323c; --tint:#161c24;
  --rx:#8ea8ff; --rx-soft:#1b2440; --warn:#ff8f85; --pill:#d9b93e; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0f1318; --ink:#e5e9ef; --muted:#98a2b0; --rule:#2b323c; --tint:#161c24;
  --rx:#8ea8ff; --rx-soft:#1b2440; --warn:#ff8f85; --pill:#d9b93e; color-scheme:dark }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1.125rem;line-height:1.6;margin:0}
.wrap{max-width:calc(var(--measure) + 2rem);margin:0 auto;padding-inline:1rem;padding-block:1.25rem 4rem}
a{color:var(--rx);text-underline-offset:.15em;text-decoration-thickness:1px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--rx);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:1rem;top:1rem;background:var(--paper);padding:.5rem;z-index:9}

/* masthead */
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;font-family:var(--f-mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--ink);padding-bottom:.5rem}
.mast a{color:var(--ink);text-decoration:none;font-weight:500}
.rxonly{font-family:var(--f-display);font-weight:700;font-size:1rem;letter-spacing:0;text-transform:none;color:var(--ink)}
.hl-label{font-family:var(--f-display);font-weight:700;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;margin:1.25rem 0 .25rem}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2.6rem,9.5vw,4.8rem);line-height:.93;letter-spacing:-.01em;margin:.25rem 0 .75rem;text-wrap:balance}
h1 .tm{font-size:.35em;vertical-align:super;font-weight:500}
.dek{font-size:1.15rem;color:var(--muted);margin:0 0 1rem;text-wrap:pretty}
.disclaim{font-family:var(--f-display);font-weight:600;font-size:.95rem;line-height:1.35;margin:0 0 1.25rem;padding:.6rem .75rem;border-left:3px solid var(--rx);background:var(--tint)}

/* hero pen */
.hero-pen{margin:0 0 1.25rem;overflow:hidden}
.hero-pen svg{display:block;width:100%;height:auto}

/* highlights grid */
.highlights{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));border:1px solid var(--ink);margin:0 0 1.5rem}
.highlights div{padding:.7rem .8rem;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-width:0}
.highlights dt{font-family:var(--f-display);font-weight:700;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.highlights dd{margin:.15rem 0 0;font-family:var(--f-display);font-weight:600;font-size:1.35rem;line-height:1.15;font-variant-numeric:tabular-nums}
.highlights dd small{display:block;font-family:var(--f-body);font-weight:400;font-size:.85rem;color:var(--muted);line-height:1.35;margin-top:.2rem}

/* boxed warning */
.boxed{border:2.5px solid var(--ink);padding:.9rem 1rem 1rem;margin:0 0 2rem}
.boxed h2{font-family:var(--f-display);font-weight:700;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;margin:0 0 .5rem;text-align:center}
.boxed ul{margin:0;padding-left:1.1rem;font-family:var(--f-display);font-weight:500;font-size:1rem;line-height:1.4}
.boxed li+li{margin-top:.35rem}

.lede{font-size:1.2rem;line-height:1.6}
.lede p:first-child::first-line{font-variant:small-caps;letter-spacing:.03em}

/* contents */
nav.toc{margin:2.25rem 0 1rem;border-top:2px solid var(--ink);padding-top:.75rem}
nav.toc h2{font-family:var(--f-display);font-weight:700;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;margin:0 0 .5rem}
nav.toc ol{list-style:none;margin:0;padding:0;columns:2 18rem;column-gap:2rem}
nav.toc li{break-inside:avoid;font-family:var(--f-display);font-weight:500;font-size:1rem;line-height:1.3;padding:.2rem 0}
nav.toc a{color:var(--ink);text-decoration:none;display:flex;gap:.6rem}
nav.toc a:hover{color:var(--rx)}
.tocno{font-family:var(--f-mono);font-size:.8rem;color:var(--rx);min-width:1.4rem;padding-top:.1rem}
.toc-tools{margin-top:.6rem;font-family:var(--f-display);font-weight:600;font-size:.95rem;display:flex;flex-wrap:wrap;gap:.4rem .9rem}

/* body */
article h2,.sec-h{font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,4.5vw,1.9rem);line-height:1.12;margin:3rem 0 .9rem;padding-top:.6rem;border-top:1px solid var(--rule);text-wrap:balance;scroll-margin-top:1rem}
.secno{font-family:var(--f-mono);font-weight:500;font-size:.8rem;color:var(--paper);background:var(--rx);padding:.1rem .4rem;vertical-align:.35em;margin-right:.35rem;border-radius:2px}
article h3{font-family:var(--f-display);font-weight:700;font-size:1.2rem;margin:2rem 0 .5rem;text-wrap:balance}
article p{margin:0 0 1.05rem;text-wrap:pretty}
article strong{font-weight:600}
article ul,article ol{padding-left:1.25rem;margin:0 0 1.05rem}
article code{font-family:var(--f-mono);font-size:.85em;background:var(--tint);padding:.05em .3em;border-radius:3px}
sup{line-height:0}
a.footnote-ref{font-family:var(--f-mono);font-size:.68rem;text-decoration:none;padding:0 .1em}
a.footnote-ref::before{content:"["}
a.footnote-ref::after{content:"]"}

/* figures */
.fig{margin:1.75rem 0;display:grid;gap:.75rem}
.fig.pair{grid-template-columns:repeat(auto-fit,minmax(14rem,1fr))}
.fig figure{margin:0;min-width:0}
.fig .frame{display:block;background:var(--tint);border:1px solid var(--rule);overflow:hidden;position:relative}
.fig img{display:block;width:100%;height:auto;max-height:34rem;object-fit:contain;background:var(--tint)}
.fig .fallback{display:none;padding:1.25rem 1rem;min-height:9rem;font-family:var(--f-display);font-weight:600;font-size:1rem;color:var(--muted);align-content:center}
.fig .frame.broken img{display:none}
.fig .frame.broken .fallback{display:grid;gap:.25rem}
.fig figcaption{font-size:.88rem;line-height:1.4;color:var(--muted);margin-top:.4rem}
.fig figcaption b{color:var(--ink);font-weight:600}
.fig figcaption .credit{display:block;font-family:var(--f-mono);font-size:.7rem;margin-top:.2rem}

/* modules share a shell */
.mod{margin:2rem 0;border:2px solid var(--ink)}
.mod-head{padding:.75rem .9rem;border-bottom:1px solid var(--ink);background:var(--tint)}
.mod-head .kicker{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--rx)}
.mod-head h3{margin:.1rem 0 0;font-family:var(--f-display);font-weight:700;font-size:1.2rem;line-height:1.2}
.mod-head p{margin:.25rem 0 0;font-size:.9rem;color:var(--muted);line-height:1.4}
.mod-body{padding:.9rem}
.mod-foot{padding:.5rem .9rem;border-top:1px solid var(--rule);font-family:var(--f-mono);font-size:.7rem;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.mod-foot a{color:var(--muted)}
.btn{font:600 1rem var(--f-display);color:var(--paper);background:var(--rx);border:1px solid var(--rx);border-radius:3px;padding:.5rem .9rem;cursor:pointer}
.btn.ghost{color:var(--rx);background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.field{display:flex;flex-direction:column;gap:.2rem;font-family:var(--f-display);font-weight:600;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);min-width:0}
.field input,.field select{font:500 1rem var(--f-display);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:.45rem .5rem;width:100%;min-width:0;text-transform:none;letter-spacing:0}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:end}
.row>.field{flex:1 1 11rem}

/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:5.2rem minmax(0,1fr);gap:.75rem;padding:.55rem 0;border-bottom:1px solid var(--rule)}
.tl li:last-child{border-bottom:0}
.tl .d{font-family:var(--f-mono);font-size:.78rem;color:var(--rx);padding-top:.2rem;font-variant-numeric:tabular-nums}
.tl .l{font-family:var(--f-display);font-weight:700;font-size:1.02rem;line-height:1.25}
.tl .x{font-size:.92rem;line-height:1.4;color:var(--muted)}
.tl .x a{font-family:var(--f-mono);font-size:.7rem;margin-left:.2rem;white-space:nowrap}
.tl li.key .l{color:var(--warn)}
.tl-more{max-height:26rem;overflow:hidden;position:relative}
.tl-more.open{max-height:none}
.tl-more:not(.open)::after{content:"";position:absolute;inset:auto 0 0 0;height:4rem;background:linear-gradient(transparent,var(--paper))}

/* charts */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.chart .lbl{fill:var(--ink);font-family:var(--f-display);font-weight:600;font-size:13px}
.chart .bar{fill:var(--rx)}
.chart .bar.peak{fill:var(--warn)}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart .range{stroke:var(--rx);stroke-width:3;stroke-linecap:round}
.chart .med{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.chart .val{fill:var(--ink);font-size:11px}

/* museum */
.museum{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:0}
.museum li{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);min-width:0}
.museum a{display:block;padding:.65rem .8rem;text-decoration:none;color:var(--ink);height:100%}
.museum a:hover{background:var(--tint)}
.museum .t{font-family:var(--f-display);font-weight:700;font-size:1rem;line-height:1.25}
.museum .w{font-size:.85rem;color:var(--muted);line-height:1.35;margin-top:.15rem}
.museum .h{font-family:var(--f-mono);font-size:.68rem;color:var(--rx);margin-top:.3rem}

/* quiz */
.quiz-card{border:1px dashed var(--rule);padding:1rem;min-height:9.5rem;display:grid;gap:.75rem;align-content:start}
.quiz-n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.quiz-q{font-family:var(--f-display);font-weight:700;font-size:1.35rem;line-height:1.2;text-wrap:balance}
.quiz-a{font-size:.98rem;line-height:1.45}
.quiz-a .verdict{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-right:.35rem}
.quiz-a .ok{color:var(--rx)}.quiz-a .no{color:var(--warn)}
.quiz-score{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}

/* generator + certificate stage */
.stage{background:var(--tint);border:1px solid var(--rule);margin-top:.9rem;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.note{font-size:.88rem;color:var(--muted);margin:.5rem 0 0;line-height:1.4}
.note.warn{color:var(--warn);font-family:var(--f-display);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.6rem}
.seg button{font:600 .95rem var(--f-display);color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:.4rem .7rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* directory */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.5rem;padding:.75rem .9rem;border-bottom:1px solid var(--rule)}
.filters .q{grid-column:1/-1}
.dir-count{padding:.5rem .9rem;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.dir-list{list-style:none;margin:0;padding:0}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.15rem 1rem;padding:.75rem .9rem;border-bottom:1px solid var(--rule)}
.entry .brand{font-family:var(--f-display);font-weight:700;font-size:1.1rem;line-height:1.2}
.entry .gen{font-family:var(--f-body);font-style:italic;font-weight:400;font-size:.9rem;color:var(--muted);margin-left:.3rem}
.entry .item{grid-column:1/-1;font-size:1rem;line-height:1.4}
.entry .maker{color:var(--muted)}
.entry .design{grid-column:1/-1;font-size:.88rem;color:var(--muted);line-height:1.4}
.entry .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.35rem .5rem;align-items:center;margin-top:.3rem;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.entry .era{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);text-align:right;max-width:12rem;padding-top:.2rem}
.chip{border:1px solid var(--rule);border-radius:2px;padding:.05rem .35rem;white-space:nowrap}
.chip.price{border-color:var(--pill);background:color-mix(in srgb,var(--pill) 18%,transparent);color:var(--ink)}
.conf{font-weight:500}
.conf.press{background:var(--rx);border-color:var(--rx);color:var(--paper)}
.conf.opened{border-color:var(--rx);color:var(--rx)}
.conf.title{border-style:dashed}
.entry .src{margin-left:auto}
.more{display:block;width:100%;font:600 1rem var(--f-display);color:var(--rx);background:var(--paper);border:0;padding:.8rem;cursor:pointer}
.more:hover{background:var(--tint)}
.empty{padding:1.25rem .9rem;color:var(--muted);font-size:.95rem}
.dl{display:flex;gap:.75rem;flex-wrap:wrap}

/* faq + cite + references */
.faq details{border-bottom:1px solid var(--rule);padding:.6rem 0}
.faq summary{font-family:var(--f-display);font-weight:700;font-size:1.08rem;cursor:pointer;line-height:1.3}
